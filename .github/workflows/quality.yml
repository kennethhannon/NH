name: PracticalKit Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculation-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
  desktop-and-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright==1.56.0
      - run: python tests/browser_smoke.py
