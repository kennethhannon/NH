name: PracticalKit quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculator logic
        run: npm test
      - name: Install Playwright browser testing
        run: |
          python3 -m pip install --user --break-system-packages playwright
          python3 -m playwright install chromium --with-deps
      - name: Test site in desktop and mobile browser sizes
        run: python3 tests/browser_smoke.py
